name: Verify and release

on:
  push:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: handyhelpers
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - name: Regression tests
        env:
          HH_TEST_POSTGRES: ${{ matrix.database == 'postgres' && '1' || '' }}
        run: pytest -m 'not browser'

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev,docs]'
      - run: ruff check . && ruff format --check .
      - run: python -m sphinx -W --keep-going -b html docs/source /tmp/handyhelpers-docs
      - run: python -m build && python -m twine check dist/*
      - run: python scripts/verify_distribution.py
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: distributions
          path: dist/*

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: python -m playwright install --with-deps chromium
      - run: pytest -m browser

  optional-installs:
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      matrix:
        extra: [core, api, auditlog, admin, excel, all]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8.0.1
        with:
          name: distributions
          path: dist
      - name: Install wheel and selected extra
        env:
          HH_EXTRA: ${{ matrix.extra }}
        run: |
          python - <<'PY'
          import os, pathlib, subprocess, sys
          wheel = next(pathlib.Path('dist').glob('*.whl'))
          extra = os.environ['HH_EXTRA']
          spec = str(wheel) if extra == 'core' else f'{wheel}[{extra}]'
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', spec])
          PY
      - name: Smoke-test installed wheel outside source checkout
        env:
          HH_EXTRA: ${{ matrix.extra }}
        run: |
          cp scripts/verify_distribution.py /tmp/verify_handyhelpers.py
          cd /tmp
          python verify_handyhelpers.py --installed "$HH_EXTRA"

  publish:
    if: github.event_name == 'release'
    needs: [tests, quality, browser, optional-installs]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: ${{ secrets.PYPI_USERNAME }}
          password: ${{ secrets.PYPI_PASSWORD }}
