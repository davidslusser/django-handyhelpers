{% load chart_tags %}
{% include 'handyhelpers/component/chartjs_components.htm' %}
<div class="row mb-4 text-center">
{% for chart in chart_set %}
<div class="col-sm-12 col-md-4"><canvas id="{{ chart.id }}"></canvas></div>
{% chart_config chart as config %}
<div hidden data-hh-chart="{{ chart.id }}">{{ config|json_script }}</div>
{% endfor %}
</div>
