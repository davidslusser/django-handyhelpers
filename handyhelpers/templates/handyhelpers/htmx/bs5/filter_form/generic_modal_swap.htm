<div class="modal-dialog modal-dialog-scrollable {{ modal_size|default:'modal-lg' }}">
<form class="modal-content" hx-post="{{ form.hx_post_url }}{% if display %}{{ display }}/{% endif %}" hx-target="#body_main" hx-push-url="true">
<div class="modal-header"><h2 class="modal-title fs-5" id="generic_modal_label">{{ modal_title }}</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
<div class="modal-body">{% csrf_token %}{% include 'handyhelpers/htmx/bs5/form/inline_form.htm' %}</div>
<div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal">{{ modal_button_close }}</button><button type="submit" class="btn btn-primary">{{ modal_button_submit }}</button></div>
</form></div>
